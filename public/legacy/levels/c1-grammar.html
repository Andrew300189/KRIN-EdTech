<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <header>
      <div class="container nav">
        <a class="brand" href="../index.html">

        <nav class="nav-links">

          <a href="c1.html">C1</a>

        </nav>

    </header>

    <main class="section">
      <div class="container">
        <div class="eyebrow">CEFR level</div>
        <h1 class="title">C1 Grammar Courses</h1>
        <p class="subtitle">Choose a grammar topic to continue learning.</p>

        <div class="levels-stack" style="margin-top: 1.2rem">
          <a
            class="level-block level-link"
            href="/dashboard/courses?academy=general-english&stage=c1&course=inversion"

            <span class="level-head"><h3>Inversion</h3></span>

          <a

            href="/dashboard/courses?academy=general-english&stage=c1&course=ellipsis"

          </a>
          <a
            class="level-block level-link"
            href="/dashboard/courses?academy=general-english&stage=c1&course=advanced-discourse-markers"

          <a

          <a

          </a>
          <a
            class="level-block level-link"
            href="/dashboard/courses?academy=general-english&stage=c1&course=stylistics"
            aria-label="Open Stylistics"
          >
            <span class="level-head"><h3>Stylistics</h3></span>
          </a>
          <a
            class="level-block level-link"
            href="/dashboard/courses?academy=general-english&stage=c1&course=academic-english"

            <span class="level-head"><h3>Academic English</h3></span>
          </a>
          <a
            class="level-block level-link"
